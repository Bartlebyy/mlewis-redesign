[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect the old extensionless URLs from the previous site so any
# existing backlinks / bookmarks / search results keep working.
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
[[redirects]]
  from = "/about/"
  to = "/about.html"
  status = 301
[[redirects]]
  from = "/listen"
  to = "/listen.html"
  status = 301
[[redirects]]
  from = "/listen/"
  to = "/listen.html"
  status = 301
[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 301
[[redirects]]
  from = "/gallery/"
  to = "/gallery.html"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301
[[redirects]]
  from = "/contact/"
  to = "/contact.html"
  status = 301
