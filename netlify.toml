[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; media-src 'self'; frame-src https://open.spotify.com; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect the old extensionless URLs from the previous site so any
# existing backlinks / bookmarks / search results keep working.
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
[[redirects]]
  from = "/about/"
  to = "/about.html"
  status = 301
[[redirects]]
  from = "/listen"
  to = "/listen.html"
  status = 301
[[redirects]]
  from = "/listen/"
  to = "/listen.html"
  status = 301
[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 301
[[redirects]]
  from = "/gallery/"
  to = "/gallery.html"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301
[[redirects]]
  from = "/contact/"
  to = "/contact.html"
  status = 301
